name: Build Equicord release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild Equicord.bat
        shell: pwsh
        run: .\build\Build-Release.ps1

      - name: Verify committed release is current
        shell: pwsh
        run: |
          git diff --exit-code -- Equicord.bat
          .\build\Test-Release.ps1
          $env:EQUICORD_SETUP_VALIDATE_ONLY = "1"
          .\Equicord.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload ready-to-run installer
        uses: actions/upload-artifact@v4
        with:
          name: Equicord-setup
          path: Equicord.bat
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download ready-to-run installer
        uses: actions/download-artifact@v4
        with:
          name: Equicord-setup

      - name: Attach installer to version release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload "$env:GITHUB_REF_NAME" Equicord.bat --clobber --repo "$env:GITHUB_REPOSITORY"
          } else {
              gh release create "$env:GITHUB_REF_NAME" Equicord.bat --generate-notes --title "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY"
          }
